name: calm_link
description: Panic Attack Monitoring & Assistance System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.1

  # Backend & Database
  supabase_flutter: ^2.0.0

  # Health & Wearables
  health: ^10.0.0
  flutter_health_connect: ^1.2.3

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Communication
  url_launcher: ^6.2.2
  share_plus: ^7.2.1

  # Charts & Graphs
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.0
  uuid: ^4.3.3

  # Permissions
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true


http: ^1.1.0
shared_preferences: ^2.2.2
